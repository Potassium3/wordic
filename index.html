<!doctype html>
<html>
  <head>
    <title>C# Interpreter</title>
    <style>
        * {
          box-sizing: border-box;
          font-family: 'Roboto Mono', monospace;
          caret-color: white;
        }
        html, body {
          margin: 0;
          padding: 0;
          background-color: #08080a;
          color: white;
          width: 100%;
          height: 100%;
          --blue: #03d3fc;
          --green: #08ff63;
          --red: #ff0038;
          --back: #241800;
        }

        h1 {
          height: 70px;
          line-height: 50px;
          text-align: center;
          margin: 0;
          padding: 20px 0 0;
        }

        div.workspace {
          display: flex;
          flex-direction: row;
          gap: 5px;
          width: calc(100% - 40px);
          height: calc(100% - 110px);
          margin: 20px;
          position: relative;
        }

        div.editor {
          position: relative;
          flex-grow: 2;
          height: 100%;
          border-radius: 10px;
          margin: 0;
          outline: none;
          border: none;
          resize: none;
          color: #dddddd;
          background-color: var(--back);
          font-size: 15pt;
          z-index: 1000;
          overflow-x: auto;
          overflow-y: auto;
        }

        .tools {
          position: absolute;
          top: 0;
          left: 0;
          height: 50px;
          width: 100%;
          z-index: 4;
          background-color: var(--back);
          border-bottom: 2px solid #ffffff22;
        }

        .ide {
          position: absolute;
          top: 50px;
          left: 0;
          width: 100%;
          height: calc(100% - 50px);
          overflow: auto;
        }

        .code {
          position: absolute;
          outline: none;
          left: 50px;
          top: 0;
          color: #ffffff22;
          
          z-index: 2;
          white-space: pre;
          padding-right: 20px;
          padding-left: 10px;
          padding-bottom: 40px;
          
          min-width: calc(100% - 50px);
          min-height: 100%;
        }

        .coloured {
          position: absolute;
          top: 0;
          left: 50px;
          
          z-index: 1;
          white-space: pre;
          padding-right: 20px;
          padding-left: 10px;
          padding-bottom: 40px;
        }

        .numbers {
          position: sticky;
          left: 0;
          width: 50px;
          height: fit-content;
          z-index: 3;
          background-color: var(--back);
          opacity: 0.95;
          text-align: right;
          padding-right: 5px;
          color: #ffffff66;
          user-select: none;
        }

        div.slider {
          position: relative;
          width: 10px;
          border-radius: 5px;
          cursor: ew-resize;
        }

        div.slider-decor {
          position: absolute;
          top: 50%;
          left: 25%;
          width: 50%;
          height: 100px;
          transform: translateY(-50%);
          background-color: var(--back);
          border-radius: 9999px;
        }

        div.slider:hover>div {
          background-color: white;
        }

        div.output {
            flex-grow: 1;
            height: 100%;
            border-radius: 10px;
            padding: 10px;
            margin: 0;
            outline: none;
            border: none;
            resize: none;
            color: white;
            background-color: var(--back);
            font-size: 15pt;
            z-index: 1000;
        }

        .tx-a {
          display: inline-block;
          color: var(--blue);
          z-index: 2;
        }

        .tx-s {
          display: inline-block;
          color: var(--green);
          z-index: 2;
        }

        .tx-f {
          display: inline-block;
          color: var(--red);
          z-index: 2;
        }
    </style>
  </head>
  <body>
    <h1 id="title">Code language</h1>
    <div class="workspace">
      <div class="editor">
        <div id="tools" class="tools">Tools</div>
        <div id="ide" class="ide">
          <div id="code" class="code" placeholder="Enter some code here" type="textarea" contenteditable>note this is starter code
var a zero
repeat 8
set a plus a one
out string a
end</div>
          <div id="coloured" class="coloured"></div>
          <div id="numbers" class="numbers"></div>
        </div>
      </div>
      <div class="slider">
        <div class="slider-decor"></div>
      </div>
      <div class="output">Output here</div>
    </div>
    <script>

      let blue = ["var", "set", "while", "for", "search"];
      let green = ["plus", "minus", "one", "zero", "not", "or", "and", "times", "over", "is", "in"];
      let red = ["note"];

      function render(text) {
        
        let code = "";
        let line = "";
        let word = "";
        let lineCount = 1;
        let include = false;
        text += "\n";
        document.getElementById("numbers").innerText = "1";
        for (let char of text) {
          if (char == " " || char == "\n") {
            if (blue.includes(word)) {
              code += `<span class="tx-a">${word}</span>`
            } else if (green.includes(word)) {
              code += `<span class="tx-s">${word}</span>`
            } else if (red.includes(word)) {
              code += `<span class="tx-f">${word}</span>`
            } else {
              code += word;
            }

            code += char;
            word = "";
          } else {
            word += char;
          }
          if (char == "\n") {
            line = "";
            lineCount++;
            document.getElementById("numbers").innerHTML += `<br>${lineCount}`;
          } else {
            line += char;
          }
        }
        document.getElementById("coloured").innerHTML = code;
        
      }

      document.getElementById("code").addEventListener("keyup", (function() {
        let text = this.innerText;
        render(text);
      }));

      render(document.getElementById("code").innerText);
      
    </script>
  </body>
</html>
