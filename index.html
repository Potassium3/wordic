<!doctype html>
<html>
  <head>
    <title>Wordic Interpreter</title>
    <style>
        * {
          box-sizing: border-box;
          font-family: 'Roboto Mono', monospace;
          font-size: 15pt;
          line-height: 22px;
          caret-color: white;
          scrollbar-width: none;
        }
        html, body {
          margin: 0;
          padding: 0;
          background-color: #08080a;
          color: white;
          width: 100%;
          height: 100%;
          --blue:      #03d3fc;
          --green:     #08ff63;
          --yellow:    #ffd700;
          --beige:     #ffe3b2;
          --red:       #ff0038;
          --purple:    #d2a7fa;
          --error-red: #ba0000;
          --back-red:  #410f0f;
          --grey:      #949fa4;
          --lightgrey: #444444;
          --back:      #2d2d2d;

          --tool-height: 50px;
        }

        h1 {
          height: 70px;
          line-height: 50px;
          font-size: 24pt !important;
          text-align: center;
          margin: 0;
          padding: 20px 0 0;
        }

        p {
          line-height: 15px;
          font-size: 9pt !important;
          margin: 0;
        }

        div.workspace {
          display: flex;
          flex-direction: row;
          gap: 5px;
          width: calc(100% - 40px);
          height: calc(100% - 110px);
          margin: 20px;
          position: relative;
        }

        div.editor {
          width: 0;
          flex-basis: 0;

          position: relative;
          height: 100%;
          border-radius: 15px;
          margin: 0;
          outline: none;
          border: none;
          resize: none;
          color: #dddddd;
          background-color: var(--back);
          font-size: 15pt;
          z-index: 1000;
          flex-grow: 1.6;
          overflow-x: auto;
          overflow-y: auto;
        }

        .tools {
          display: flex;
          justify-content: left;
          gap: 5px;
          position: absolute;
          top: 0;
          left: 0;
          height: var(--tool-height);
          width: 100%;
          z-index: 4;
          background-color: var(--back);
          overflow-x: auto;
          box-shadow: 0px 0 5px black;
          scrollbar-width: none;
        }

        .ide {
          position: absolute;
          top: var(--tool-height);
          left: 0;
          width: 100%;
          height: calc(100% - var(--tool-height));
          overflow: auto;
        }

        .code {
          position: absolute;
          outline: none;
          left: 50px;
          top: 0;
          width: fit-content;
          height: fit-content;
          field-sizing: content;
          color: transparent; /* transparent .code overlays .coloured*/
          background-color: transparent;
          
          z-index: 2;
          white-space: pre;
          margin: 0;
          border: none;
          padding-right: 20px;
          padding-left: 10px;
          padding-bottom: 100px;
          padding-top: 0;
          
          min-width: calc(100% - 50px);
          min-height: 100%;
          font-family: inherit;
          font-size: inherit;
          line-height: inherit;

          resize: none;
        }

        .coloured {
          position: absolute;
          top: 0;
          left: 50px;
          width: fit-content;
          height: fit-content;
          min-width: calc(100% - 50px);
          min-height: 100%;
          
          z-index: 1;
          white-space: pre;
          padding-right: 20px;
          padding-left: 10px;
          padding-bottom: 100px;
          padding-top: 0;
          cursor: pointer;
          border-bottom-right-radius: 15px;
        }

        .coloured>div {
          display: block;
          min-height: 22px;
          border-radius: 5px;
          width: fit-content;
        }

        .coloured>div.red {
          background-color: var(--error-red);
        }

        .numbers {
          position: sticky;
          left: 0;
          width: 50px;
          height: fit-content;
          min-height: 100%;
          z-index: 3;
          background-color: var(--back);
          opacity: 0.95;
          text-align: right;
          padding-right: 5px;
          padding-bottom: 100px;
          color: #ffffff66;
          user-select: none;
        }

        div#pointer {
          position: absolute;
          right: 0;
          width: 11px;
          height: 22px;
          transform: translateX(50%) translateY(-50%) scale(0.5);
          background-color: #ffffff;
          clip-path: polygon(0 0, 100% 50%, 0 100%);
          z-index: 6;
          transition: top 0.2s;
        }

        div#callers {
          position: absolute;
          right: 0;
          width: 11px;
          height: 100%;
          z-index: 5;
        }

        div.caller {
          position: absolute;
          right: 0;
          width: 11px;
          height: 22px;
          transform: translateX(50%) scale(0.5);
          background-color: #888888;
          clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        div.slider {
          position: relative;
          width: 10px;
          border-radius: 5px;
          cursor: ew-resize;
        }

        div.slider-decor {
          position: absolute;
          top: 50%;
          left: 25%;
          width: 50%;
          height: 100px;
          transform: translateY(-50%);
          background-color: var(--back);
          border-radius: 9999px;
        }

        div.slider:hover>div {
          background-color: white;
        }

        div.results {
          display: flex;
          flex-direction: column;
          gap: 20px;

          flex-basis: 0;
          height: 100%;

          margin: 0;
          outline: none;
          border: none;
          resize: none;
          color: white;
          font-size: 15pt;
          z-index: 1000;
          flex-grow: 1;
        }

        div.output {
          position: relative;
          border-radius: 15px;
          background-color: var(--back);
          overflow: auto;
          scrollbar-width: auto;
          width: 100%;
          height: 100%;
        }

        div#errors {
          position: relative;
          overflow: auto;
          
          border-radius: 15px;
          background-color: var(--back);
          overflow-y: auto;
          scrollbar-width: auto;
          width: 300px;
          height: 150px;
        }

        div#errors.red {
          background-color: var(--back-red) !important;
        }

        div#errors>div {
          position: absolute;
          top: 0;
          left: 0;
          width: fit-content;
          height: fit-content;
          padding: 15px;
        }

        div.output-value {
          position: absolute;
          top: var(--tool-height);
          left: 0;
          width: 100%;
          height: calc(100% - calc(2 * var(--tool-height)));
          overflow: auto;
          padding: 15px;
          padding-top: 0;
          white-space: pre;
          box-shadow: inset 0 -5px 5px -5px black;
        }

        input.input-value {
          display: none;
          position: absolute;
          bottom: 10px;
          left: 10px;
          width: calc(100% - 20px);
          height: var(--tool-height);
          overflow: auto;
          padding: 15px;
          padding-left: 35px;
          white-space: pre;
          background-color: #000000;
          color: white;
          border: none;
          border-radius: 999px;
          animation: input-pop-up 0.2s forwards;
          z-index: 1;
        }

        div.input-arrow {
          display: none;
          position: absolute;
          bottom: 25px;
          left: 25px;
          width: 20px;
          height: 20px;
          white-space: pre;
          color: var(--green);
          z-index: 999;
        }

        .output:has(.input-value) div.input-arrow {
          display: block;
        }

        @keyframes input-pop-up {
          0% {
            transform: translateY(10px);
          }
          100% {
            transform: translateY(0);
          }
        }

        /*input.input-value::before {
          content: ">";
        }*/

        button.square {
          display: block;
          background-color: transparent;
          border-radius: 10px;
          margin: 5px;
          border: none;
          min-width: fit-content;
          height: 40px;
          color: white;
          cursor: pointer;
          font-family: inherit;
          padding: 0 10px;
        }

        button.square:hover {
          background-color: #ffffff22;
        }

        span {
          font-size: inherit;
          line-height: inherit;
        }

        .tx-a {
          display: inline-block;
          color: var(--blue);
          z-index: 2;
        }

        .tx-s {
          display: inline-block;
          color: var(--green);
          z-index: 2;
        }

        .tx-f {
          display: inline-block;
          color: var(--red);
          z-index: 2;
        }

        .tx-d {
          display: inline-block;
          color: var(--yellow);
          z-index: 2;
        }

        .tx-b {
          display: inline-block;
          color: var(--grey);
          z-index: 2;
        }

        .tx-h {
          display: inline-block;
          color: var(--purple);
          z-index: 2;
        }

        .tx-l {
          display: inline-block;
          color: var(--lightgrey);
          z-index: 2;
        }
    </style>
  </head>
  <body>
    <h1 id="title">Wordic Interpreter</h1>
    <div class="workspace">
      <div class="editor">
        <div id="tools" class="tools">
          <button class="square">Identifiers</button>
          <button class="square"><div class="tx-s">Commands</div></button>
          <button class="square"><div class="tx-a">Operators</div></button>
          <button class="square"><div class="tx-h">Constants</div></button>
          <button class="square"><div class="tx-d">Constructs</div></button>
          <button class="square"><div class="tx-f">Functions</div></button>
          <button class="square"><div class="tx-b">Comments</div></button>
        </div>
        <div id="ide" class="ide">
          <textarea id="code" class="code" contenteditable></textarea>
          <div id="coloured" class="coloured"></div>
          <div id="numbers" class="numbers"><div id="pointer"></div><div id="callers"></div></div>
        </div>
      </div>
      <div class="slider">
        <div class="slider-decor"></div>
      </div>
      <div class="results">
        <div class="output">
          <div id="outputtools" class="tools">
            <button id="run" class="square"><span class="tx-s">Run</span></button>
          </div>
          <div id="output-value" class="output-value"></div>
          <div id="input-arrow" class="input-arrow">&gt;</div>
        </div>
        <div id="errors">
          <div>
            <div><span id="error-line" class="tx-f">0</span> &middot; <span id="error-code"><span class="tx-b">NO ERRORS</span></span></div>
            <p id="error-message"><span class="tx-b">No errors found yet.</span></p>
            <p id="error-tip"><span class="tx-b">Tip: No errors in future please.</span></p>
          </div>
        </div>
      </div>
    </div>
    <script src="interpreter.js"></script>
    <script>
      
      
    </script>
  </body>
</html>
